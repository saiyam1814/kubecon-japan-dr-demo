apiVersion: v1
kind: Namespace
metadata:
  name: prod-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: drill-data
  namespace: prod-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drill-app
  namespace: prod-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drill-app
  template:
    metadata:
      labels:
        app: drill-app
    spec:
      containers:
        - name: app
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              if [ ! -f /data/birth.txt ]; then
                echo "cluster data born: $(date)" > /data/birth.txt
                echo "critical records: 1,247" >> /data/birth.txt
              fi
              sleep infinity
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: drill-data
